# Configuration Streamlit — thème et durcissement
# Documentation : https://docs.streamlit.io/develop/api-reference/configuration/config.toml

[theme]
# Ces valeurs sont le socle : theme.py affine ensuite en CSS.
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0A0E1A"
secondaryBackgroundColor = "#111A2E"
textColor = "#E6EDF7"
font = "sans serif"

[server]
headless = true
# Protection CSRF sur les formulaires et les websockets.
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 5
# Aucun fichier n'est servi statiquement depuis le dossier.
enableStaticServing = false
# Les erreurs détaillées restent dans les journaux du serveur, jamais dans la page.
[client]
showErrorDetails = false
toolbarMode = "minimal"
showSidebarNavigation = false

# Désactive la télémétrie d'usage de Streamlit (ce n'est pas notre outil de mesure :
# l'application dispose de sa propre télémétrie anonymisée, visible dans l'onglet dédié).
[browser]
gatherUsageStats = false

[runner]
# Recharge le module si un fichier change (utile en développement local).
fastReruns = true
